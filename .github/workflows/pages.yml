name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Construire pour le sous-chemin du dépôt
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ vars.ATLAS_BASE_PATH || format('/{0}/', github.event.repository.name) }}
          VITE_SITE_URL: ${{ vars.ATLAS_SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      - run: npm run check:budget
      - run: npx playwright install --with-deps chromium
      - name: Vérifier les liens directs GitHub Pages
        run: npm run test:pages
        env:
          TEST_PAGES_BASE: ${{ vars.ATLAS_BASE_PATH || format('/{0}/', github.event.repository.name) }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
