services:
  atlas:
    build:
      context: .
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:8080/}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      ATLAS_ADDRESS: ":80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
